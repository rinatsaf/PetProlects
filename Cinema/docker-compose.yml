services:
  postgres:
    image: postgres:16
    container_name: cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rk091011
    ports:
      - "5433:5432"
    volumes:
      - cinema_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    restart: unless-stopped
    ports:
      - "6377:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cinema_redis_data:/data
  adminer:
    image: adminer:latest
    container_name: cinema-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
  # для webhook от юкассы потому что она локал хост не видит((
  ngrok:
    image: ngrok/ngrok:latest
    container_name: cinema-ngrok
    restart: unless-stopped
    profiles:
      - tunnel
    environment:
      NGROK_AUTHTOKEN: "3Ba1aB4wklbXXsqG18eDseeOhwu_3shhA1N5gkAgDQM52r8Dw"
    command: ["http", "host.docker.internal:5276"]
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cinema_postgres_data:
  cinema_redis_data:
