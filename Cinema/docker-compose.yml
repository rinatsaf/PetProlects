services:
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    container_name: cinema-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cinema_db;Username=postgres;Password=rk091011
      ConnectionStrings__HangfireConnection: Host=postgres;Port=5432;Database=cinema_db;Username=postgres;Password=rk091011
      ConnectionStrings__Redis: redis:6379
    expose:
      - "8080"
    networks:
      - cinema-net
    
  nginx:
    image: nginx:1.27-alpine
    container_name: cinema-nginx
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cinema-net

  postgres:
    image: postgres:16
    container_name: cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rk091011
    ports:
      - "5433:5432"
    volumes:
      - cinema_postgres_data:/var/lib/postgresql/data
    networks:
      - cinema-net

  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    restart: unless-stopped
    ports:
      - "6377:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cinema_redis_data:/data
    networks:
      - cinema-net
  adminer:
    image: adminer:latest
    container_name: cinema-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - cinema-net
volumes:
  cinema_postgres_data:
  cinema_redis_data:
    
networks:
  cinema-net:
    driver: bridge
