services:

  # ───────────────────────────── Postgres ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rk091011
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: marketplace-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@marketplace.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketplace-net

  # ────────────────────────────── Mongo ───────────────────────────────
  mongodb:
    image: mongo:7
    container_name: marketplace-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - marketplace-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: marketplace-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongo
      ME_CONFIG_MONGODB_URL: mongodb://mongo:mongo@mongodb:27017/
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - marketplace-net

  # ────────────────────────────── Redis ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: marketplace-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - marketplace-net

  # ──────────────────────────── RabbitMQ ──────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: marketplace-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      retries: 5

  # ─────────────────────────────── Seq ────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: marketplace-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"  # Ingest
      - "8083:80"    # UI
    volumes:
      - seqdata:/data
    networks:
      - marketplace-net

# ────────────────────────── Volumes ──────────────────────────
volumes:
  pgdata:
  mongodata:
  redisdata:
  rabbitmqdata:
  seqdata:

# ────────────────────────── Networks ─────────────────────────
networks:
  marketplace-net:
    driver: bridge
